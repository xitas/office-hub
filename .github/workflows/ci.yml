name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    # Runs docker-compose.test.yml: the same containers as .\scripts\test-ci.ps1 on a developer machine
    # (pinned Python image, backend/requirements.lock, PostgreSQL 17, Redis, no backend/.env).
    name: Backend tests (PostgreSQL 17 + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 20  # a hung test fails the job instead of running for hours
    steps:
      - uses: actions/checkout@v4
      - name: Migrations are up to date, then tests
        run: docker compose -f docker-compose.test.yml run --rm tests
      - name: Dependency audit
        run: >-
          docker compose -f docker-compose.test.yml run --rm --no-deps --entrypoint sh tests -c
          "pip install -q pip-audit -c requirements.lock && pip-audit -r requirements.txt"
      - name: Remove test containers
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  frontend:
    name: Frontend (type-check, lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npx tsc -b
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Dependency audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
